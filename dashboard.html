<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoyMade — Top-Down Dashboard</title>
<style>
:root{
  --bg:#faf9f7; --panel:#fff; --panel2:#f4f2ee; --ink:#1c1a17; --muted:#726c64; --line:#e6e2db;
  --accent:#4f46e5; --accent2:#c7d2fe; --good:#0f7b3f; --bad:#b4232a; --warn:#8a5d00;
  --goodbg:#e4f3ea; --badbg:#fbe4e4; --warnbg:#f8eecb; --bar:#6366f1; --barbg:#eceaffaa;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161310; --panel:#211d18; --panel2:#2a251f; --ink:#eee8df; --muted:#a49b8f; --line:#342c24;
  --accent:#928bf6; --accent2:#3a3568; --good:#5cc98d; --bad:#f0888e; --warn:#e0b24d;
  --goodbg:#123122; --badbg:#3a1c1e; --warnbg:#352a12; --bar:#8b83f5; --barbg:#2b2650;
}}
:root[data-theme="light"]{--bg:#faf9f7;--panel:#fff;--panel2:#f4f2ee;--ink:#1c1a17;--muted:#726c64;--line:#e6e2db;--accent:#4f46e5;--good:#0f7b3f;--bad:#b4232a;--warn:#8a5d00;--goodbg:#e4f3ea;--badbg:#fbe4e4;--warnbg:#f8eecb;--bar:#6366f1;--barbg:#eceaff;}
:root[data-theme="dark"]{--bg:#161310;--panel:#211d18;--panel2:#2a251f;--ink:#eee8df;--muted:#a49b8f;--line:#342c24;--accent:#928bf6;--good:#5cc98d;--bad:#f0888e;--warn:#e0b24d;--goodbg:#123122;--badbg:#3a1c1e;--warnbg:#352a12;--bar:#8b83f5;--barbg:#2b2650;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:20px 20px 60px}
h1{font-size:19px;margin:0;font-weight:680;letter-spacing:.2px}
h2{font-size:15px;margin:26px 0 10px;font-weight:650}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:680;margin-top:2px}
.tabs{display:flex;gap:6px;margin:20px 0 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{cursor:pointer;padding:8px 14px;border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;background:var(--panel2);font-size:13px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
section{display:none} section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);position:sticky;top:0;background:var(--panel)}
td.r,th.r{text-align:right}
.scroll{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{position:relative;height:16px;background:var(--barbg);border-radius:4px;overflow:hidden;min-width:60px}
.bar>span{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:4px}
.bar.g>span{background:var(--good)} .bar.r>span{background:var(--bad)}
.tag{font-size:10px;padding:1px 7px;border-radius:999px;font-weight:600}
.tg-ev{background:var(--warnbg);color:var(--warn)} .tg-win{background:var(--goodbg);color:var(--good)} .tg-lose{background:var(--badbg);color:var(--bad)}
.funnel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.fstage{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.fstage b{font-size:16px;display:block}
.hl{background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:9px 13px;margin:10px 0;font-size:13px}
.big{font-size:26px;font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.split{grid-template-columns:1fr}}
.close{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:4px 10px;font-size:12px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
    <div>
      <h1>JoyMade — Top-Down Dashboard</h1>
      <div class="sub" id="scope"></div>
    </div>
    <button class="close" id="theme">◐ theme</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs"></div>
  <section id="s-overview" class="on"></section>
  <section id="s-plan"></section>
  <section id="s-eff"></section>
  <section id="s-timing"></section>
</div>
<script src="dash.js"></script>
<script>
const D=window.DASH, $=s=>document.querySelector(s);
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString();
const pct=n=>(n==null?'—':n+'%');
const bar=(v,max,cls='')=>`<div class="bar ${cls}"><span style="width:${max?Math.max(1,Math.min(100,v/max*100)):0}%"></span></div>`;
const pcell=v=>`<td class="r num ${v<0?'neg':'pos'}">${money(v)}</td>`;
const lnk=o=>o.link?`<a href="${o.link}" target="_blank" rel="noopener">${o.idea||o.full||''}</a>`:(o.idea||o.full||'');
$('#scope').textContent=D.scope+'  ·  Facebook  ·  profit = 0.70×rev − spend  ·  breakeven ROAS 1.43';

// KPIs
const k=D.overview.kpi;
$('#kpis').innerHTML=[
  ['Net profit',`<span class="${k.profit<0?'neg':'pos'}">${money(k.profit)}</span>`],
  ['Ad spend',money(k.spend)],['Revenue',money(k.rev)],['Blended ROAS',k.roas],
  ['Advertised',k.advertised.toLocaleString()],['Breakeven ROAS',k.breakeven]
].map(([a,b])=>`<div class="kpi"><div class="k">${a}</div><div class="v num">${b}</div></div>`).join('');

// tabs
const TABS=[['s-overview','Overview'],['s-plan','Plan vs Actual'],['s-eff','Ads Efficiency'],['s-timing','Occasion Timing']];
$('#tabs').innerHTML=TABS.map(([id,l],i)=>`<div class="tab ${i==0?'on':''}" data-s="${id}">${l}</div>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t.dataset.s));
});

// ---------- OVERVIEW ----------
(function(){
  const o=D.overview, f=o.funnel, p=o.p0;
  const maxsp=Math.max(...o.occasions.map(x=>x.spend));
  let h=`<div class="card"><h2 style="margin-top:0">Funnel</h2><div class="funnel">`+
    [['Created',f.created],['Live',f.live],['Advertised',f.advertised],['Profitable',f.profitable]]
    .map(([a,b],i)=>`${i?'<span style="color:var(--muted)">▸</span>':''}<span class="fstage">${a}<b class="num">${b.toLocaleString()}</b></span>`).join('')+`</div>`;
  h+=`<h2>Where the money lands</h2><div class="split">`+
    [['winner','Winners','tg-win'],['loser','Conclusive losers','tg-lose'],['untestable','Untestable (<20 ord)','']].map(([b,lab,cl])=>{
      const x=p[b]; return `<div class="card" style="margin:0"><span class="tag ${cl||'tg-lose'}">${lab}</span><div style="margin-top:6px"><b class="num">${x.n}</b> designs · ${money(x.spend)} spend · <span class="num ${x.profit<0?'neg':'pos'}">${money(x.profit)}</span></div></div>`;
    }).join('')+`</div></div>`;
  // occasion table
  h+=`<div class="card"><h2 style="margin-top:0">Financial by occasion & evergreen</h2>
    <table><thead><tr><th>Occasion</th><th class="r">Spend</th><th>% spend</th><th class="r">Profit</th><th class="r">% of loss</th><th class="r">ROAS</th><th class="r">Designs</th></tr></thead><tbody>`+
    o.occasions.map(x=>`<tr><td>${x.name} ${x.evergreen?'<span class="tag tg-ev">evergreen</span>':''}</td>
      <td class="r num">${money(x.spend)}</td><td style="width:110px">${bar(x.pct_spend,maxsp/o.kpi.spend*100)} <span class="num" style="font-size:11px">${x.pct_spend}%</span></td>
      ${pcell(x.profit)}<td class="r num">${x.pct_loss?x.pct_loss+'%':'—'}</td>
      <td class="r num" style="color:${x.roas>=1.43?'var(--good)':'var(--bad)'}">${x.roas}</td><td class="r num">${x.n}</td></tr>`).join('')+
    `</tbody></table>
    <div class="hl">Evergreen: ${money(o.evergreen.spend)} spend @ ROAS ${o.evergreen.roas} → <span class="${o.evergreen.profit<0?'neg':'pos'}">${money(o.evergreen.profit)}</span> &nbsp;·&nbsp; Seasonal: ${money(o.evergreen.seasonal_spend)} → <span class="${o.evergreen.seasonal_profit<0?'neg':'pos'}">${money(o.evergreen.seasonal_profit)}</span></div></div>`;
  $('#s-overview').innerHTML=h;
})();

// ---------- PLAN vs ACTUAL (3-level drill-down) ----------
(function(){
  const pl=D.plan, s=pl.served, H=pl.hierarchy;
  let sel=H.find(h=>h.occasion==="Mother's Day")||H[0];
  function render(){
    let h=`<div class="card"><div class="split">
      <div><div class="sub">Ideas executed on-plan <span class="muted">(first-live in a planned week)</span></div><div class="big">${s.rate}%</div><div class="sub">${s.served.toLocaleString()} of ${s.designs.toLocaleString()} designs · advertised ${s.rate_adv}%</div></div>
      <div><div class="sub">Idea plan total (Dec 2025 → now)</div><div class="big num">${pl.plan_total_planned.toLocaleString()}</div><div class="sub">planned · ${pl.plan_total_created.toLocaleString()} created (${Math.round(pl.plan_total_created/pl.plan_total_planned*100)}% self-reported)</div></div></div></div>`;
    h+=`<div class="tabs" style="margin:12px 0 0">`+H.map(o=>`<div class="tab ${o===sel?'on':''}" data-o="${o.occasion}">${o.occasion} <span class="muted num">${o.actuals.total}</span></div>`).join('')+`</div>`;
    const o=sel;
    h+=`<div class="card"><h2 style="margin-top:0">① MASTERPLAN — high-level demand plan</h2>`;
    if(o.masterplan.length){
      h+=`<table><thead><tr><th>Sub-direction (angle)</th><th class="r">% planned</th><th class="r">Amazon search vol</th><th>Best rank</th></tr></thead><tbody>`+
        o.masterplan.map(m=>`<tr><td>${m.dir}</td><td class="r num">${m.pct!=null?m.pct+'%':'—'}</td><td class="r num">${m.searchvol?m.searchvol.toLocaleString():'—'}</td><td>${m.rank||'—'}</td></tr>`).join('')+`</tbody></table>`;
    } else h+=`<div class="muted">No detailed masterplan sheet for this occasion (only Mother's Day &amp; Father's Day were fully speced in H1.2026 MASTERPLAN).</div>`;
    h+=`</div>`;
    h+=`<div class="card"><h2 style="margin-top:0">② JM IDEA'S PLAN — detailed (${o.jm_plan.length} rows)${o.window?' · window '+o.window[0]+' → '+o.window[1]:''}</h2>
      <div class="sub" style="margin-bottom:6px">Click a row to reveal the matched idea codes (matched by week + product + PIC).</div>
      <div class="scroll"><table><thead><tr><th>Section</th><th>Product Type</th><th>Product</th><th>Niche / Idea Direction</th><th class="r">Qty</th><th>PIC</th><th class="r">Created</th><th>Pending</th><th class="r">Matched</th></tr></thead><tbody>`+
      (o.jm_plan.length?o.jm_plan.map((r,i)=>`<tr class="prow" data-i="${i}" style="cursor:pointer"><td>${r.section||'—'}</td><td>${r.product_type||'—'}</td><td>${r.product||'—'}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis" title="${(r.niche||'').replace(/"/g,'')}">${r.niche||'—'}</td><td class="r num">${r.planned}</td><td>${r.pic||'—'}</td><td class="r num">${r.created}</td><td style="max-width:130px;overflow:hidden;text-overflow:ellipsis" title="${(r.pending||'').replace(/"/g,'')}">${r.pending||''}</td><td class="r num">${r.matched.length}</td></tr><tr class="pdet" data-d="${i}" style="display:none"><td colspan="9" style="background:var(--panel2);white-space:normal;line-height:1.9">${r.matched.length?r.matched.map(m=>`${m.link?'<a href="'+m.link+'" target="_blank" rel="noopener">':''}${m.idea||m.full}${m.link?'</a>':''} <span class="muted num">(r${m.roas}${m.served===false?' · late':(m.served===true?' · ✓':'')} · ${money(m.spend)})</span>`).join(' &nbsp;·&nbsp; '):'<span class="muted">no matched idea codes for this row</span>'}</td></tr>`).join(''):`<tr><td colspan="9" class="muted">no plan rows mapped to this occasion window</td></tr>`)+
      `</tbody></table></div></div>`;
    const a=o.actuals;
    h+=`<div class="card"><h2 style="margin-top:0">③ ACTUAL IDEAS — matched, with first-ad date vs the plan</h2>`;
    if(o.occ_date) h+=`<div class="hl"><b>${a.served_pct}%</b> of ${a.total} ${o.occasion} ideas launched their first ad <b>≥2 wks before</b> ${o.occ_date} — served the plan window.${a.served_pct>=80?' <b>Timing was not the problem here</b> — the loss is economics.':''}</div>`;
    h+=`<div class="scroll"><table><thead><tr><th>Idea</th><th>Product</th><th>Recipient</th><th>First ad</th><th class="r">Days before</th><th>Serves?</th><th class="r">Spend</th><th class="r">Profit</th><th class="r">ROAS</th></tr></thead><tbody>`+
      a.rows.map(r=>`<tr><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis" title="${(r.full||'')}">${lnk(r)}</td><td>${r.product}</td><td>${r.recipient||'—'}</td><td class="num">${r.d_ads||'—'}</td><td class="r num">${r.days_before!=null?r.days_before:'—'}</td><td>${o.occ_date?(r.served?'<span class="tag tg-win">✓</span>':'<span class="tag tg-lose">✗ late</span>'):'—'}</td><td class="r num">${money(r.spend)}</td><td class="r num ${r.profit<0?'neg':'pos'}">${money(r.profit)}</td><td class="r num" style="color:${r.roas>=1.43?'var(--good)':'var(--bad)'}">${r.roas}</td></tr>`).join('')+
      `</tbody></table></div><div class="sub" style="margin-top:6px">All ${a.rows.length} advertised ideas for this occasion, sorted by spend. Spend = sum of every campaign under the idea code.</div></div>`;
    $('#s-plan').innerHTML=h;
    document.querySelectorAll('#s-plan [data-o]').forEach(t=>t.onclick=()=>{sel=H.find(x=>x.occasion===t.dataset.o);render();});
    document.querySelectorAll('#s-plan .prow').forEach(row=>row.onclick=()=>{const d=$('#s-plan .pdet[data-d="'+row.dataset.i+'"]');if(d)d.style.display=d.style.display==='none'?'table-row':'none';});
  }
  render();
})();

// ---------- ADS EFFICIENCY ----------
(function(){
  const e=D.efficiency, maxn=Math.max(...e.roas_bins.map(b=>b.n));
  let h=`<div class="card"><h2 style="margin-top:0">ROAS distribution (advertised designs)</h2>
    <div class="sub" style="margin-bottom:8px">Everything left of 1.43 loses money. Bars sized by # of designs; spend shown alongside.</div><table><tbody>`+
    e.roas_bins.map(b=>`<tr><td style="width:150px">${b.label}</td><td style="width:220px">${bar(b.n,maxn,b.label.includes('win')?'g':(b.label.includes('3.0+')?'g':''))}</td>
      <td class="r num">${b.n} designs</td><td class="r num">${money(b.spend)}</td><td class="r num ${b.profit<0?'neg':'pos'}">${money(b.profit)}</td></tr>`).join('')+
    `</tbody></table>
    <div class="hl"><b>${money(e.untestable_spend)} (${e.untestable_pct}% of spend)</b> went to <b>untestable</b> designs (&lt;20 orders) — sprayed too thin to ever conclude.</div>
    <div class="sub">Spend concentration: `+e.concentration.map(c=>`top ${c.pct_designs}% of designs = <b>${c.pct_spend}%</b> of spend`).join(' · ')+`</div></div>`;
  h+=`<div class="split">
    <div class="card"><h2 style="margin-top:0">Best ideas (profit)</h2><table><tbody>`+
      e.top.map(d=>`<tr><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis">${lnk(d)}</td><td class="r num">${d.roas}</td>${pcell(d.profit)}</tr>`).join('')+`</tbody></table></div>
    <div class="card"><h2 style="margin-top:0">Worst ideas (profit)</h2><table><tbody>`+
      e.bottom.map(d=>`<tr><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis">${lnk(d)}</td><td class="r num">${d.roas}</td>${pcell(d.profit)}</tr>`).join('')+`</tbody></table></div></div>`;
  $('#s-eff').innerHTML=h;
})();

// ---------- TIMING ----------
(function(){
  const t=D.timing, maxsp=Math.max(...t.map(b=>b.spend));
  const inwin=t[0], total=t.reduce((s,b)=>s+b.spend,0);
  let h=`<div class="card"><div class="sub">Occasion designs launched in-window (≥4 wks before the occasion date)</div>
    <div class="big">${total?Math.round(inwin.spend/total*100):0}%</div><div class="sub">of occasion ad-spend · ${D.timing_meta.occasion_designs.toLocaleString()} occasion designs with a dated occasion</div></div>`;
  h+=`<div class="card"><h2 style="margin-top:0">Lead time — when the first ad launched vs the occasion</h2><table><tbody>`+
    t.map(b=>`<tr><td style="width:200px">${b.label}</td><td style="width:220px">${bar(b.spend,maxsp)}</td><td class="r num">${b.n} designs</td><td class="r num">${money(b.spend)}</td><td class="r num ${b.profit<0?'neg':'pos'}">${money(b.profit)}</td></tr>`).join('')+
    `</tbody></table><div class="hl">If most spend is <b>in-window</b> and still losing, the problem is <b>offer/economics</b>, not timing. If most is <b>late/missed</b>, timing is a real driver.</div></div>`;
  $('#s-timing').innerHTML=h;
})();

$('#theme').onclick=()=>{const c=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark');};
</script>
</body>
</html>

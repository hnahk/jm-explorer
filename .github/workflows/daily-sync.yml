name: Daily WeLast Data Sync

on:
  schedule:
    # Runs every day at 02:00 UTC (09:00 AM ICT)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Refetch Live Catalog Products from WeLast API
        env:
          WELAST_REFRESH_TOKEN: ${{ secrets.WELAST_REFRESH_TOKEN }}
        run: |
          python3 backend/refetch_products.py

      - name: Refetch Live Campaign Data from WeLast API
        env:
          WELAST_REFRESH_TOKEN: ${{ secrets.WELAST_REFRESH_TOKEN }}
        run: |
          python3 backend/refetch_campaigns.py

      - name: Fetch Latest Orders (Incremental)
        env:
          WELAST_REFRESH_TOKEN: ${{ secrets.WELAST_REFRESH_TOKEN }}
        run: |
          python3 backend/fetch_orders.py

      - name: Rebuild Explorer & Dashboard Standalone Files
        run: |
          python3 backend/build.py
          python3 backend/etl.py
          python3 backend/build_dashboard_sql.py
          python3 backend/build_share.py

      - name: Commit & Push Live Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data.json dash.js dash.json index.html execdashboard/index.html trace/index.html backend/raw/products.json backend/raw/campaigns.json backend/raw/orders.json
          git diff-index --quiet HEAD || (git commit -m "auto: daily WeLast catalog, campaigns & orders sync [skip ci]" && git push)
